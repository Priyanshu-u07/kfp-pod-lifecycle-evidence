# Scenario 2: Unschedulable  (Provisioning / Deadline)  -- reproduces kubeflow/pipelines#13401
# No node can satisfy a 128-CPU request, so the scheduler never places the pod.
# There is no container yet, so there is no containerStatuses entry -- the reason lives on
# status.conditions[type=PodScheduled].reason. The question is what Argo puts in node.Message.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: repro-unschedulable-
spec:
  entrypoint: main
  templates:
    - name: main
      container:
        image: python:3.11-slim
        command: ["python", "-c", "print('never scheduled')"]
        resources:
          requests:
            cpu: "128"
          limits:
            cpu: "128"
